# Manual restore test into a SEPARATE, EMPTY database (never into the one the backup came from).
# Start it from GitHub: Actions -> "Database restore test" -> Run workflow, and give the number of the backup run
# (the number in the address of the "Database backup" run page: .../actions/runs/<number>).
# Needs repository secrets: RESTORE_DATABASE_URL (the empty project), BACKUP_PASSPHRASE, and BACKUP_DATABASE_URL (only to refuse a mix-up).
name: Database restore test

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "Number of the 'Database backup' run to restore"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
      - uses: actions/download-artifact@v4
        with:
          name: saitlify-database-backup
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: backup-in
      - name: Restore into the empty database and print row counts
        env:
          RESTORE_DATABASE_URL: ${{ secrets.RESTORE_DATABASE_URL }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          ops/restore-database.sh "$(ls backup-in/*.gpg | head -n 1)"
